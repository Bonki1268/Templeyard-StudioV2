<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>過去的影片</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@700&amp;display=swap">
<style>
body{margin:0;background:#F7F5F0}
a{color:#1F4E79}a:hover{color:#163A5C}
button,input,select{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #F7F5F0; color: #1F1A17; font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; line-height: 1.6; padding-bottom: 48px">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3DDD3">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; min-height: 64px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F1A17">
<span style="width: 32px; height: 32px; border-radius: 8px; background: #B3261E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px">廟</span>
<span style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 18px">廟埕影室</span>
</a>
<nav aria-label="目前位置" style="font-size: 14px; color: #5E5650">我的系列 › 淡水廟宇故事</nav>
</div>
</header>

<section style="max-width: 1280px; margin: 0 auto; padding: 32px 32px 0">
<p style="margin: 0; font-size: 13px; color: #5E5650">系列</p>
<h1 style="margin: 2px 0 4px; font-family: 'Noto Serif TC', serif; font-size: 36px; line-height: 1.3">淡水廟宇故事</h1>
<p style="margin: 0; font-size: 14px; color: #5E5650">5 支影片・3 位角色・建立於 2026-10-12</p>
<nav aria-label="系列頁面" style="display: flex; gap: 28px; margin-top: 24px; border-bottom: 1px solid #E3DDD3; flex-wrap: wrap">
<a href="Main.dc.html" style="padding: 12px 2px; text-decoration: none; color: #5E5650; border-bottom: 2px solid transparent; margin-bottom: -1px">系列設定</a>
<a href="Characters.dc.html" style="padding: 12px 2px; text-decoration: none; color: #5E5650; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 8px; align-items: center">角色庫 <span style="font-size: 12px; background: #F2EEE6; border-radius: 999px; padding: 0 8px; color: #3D3631">3</span></a>
<a href="Videos.dc.html" aria-current="page" style="padding: 12px 2px; text-decoration: none; color: #1F1A17; font-weight: 700; border-bottom: 2px solid #1F1A17; margin-bottom: -1px; display: flex; gap: 8px; align-items: center">過去的影片 <span style="font-size: 12px; background: #F2EEE6; border-radius: 999px; padding: 0 8px; color: #3D3631; font-weight: 400">5</span></a>
</nav>
</section>

<main style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 0; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div role="group" aria-label="依狀態篩選" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 8px">
<label for="sort" style="font-size: 14px; color: #5E5650">排序</label>
<select id="sort" style="height: 44px; border: 1px solid #CFC7BA; border-radius: 8px; padding: 0 12px; font-size: 14px; background: #FFFFFF; color: #1F1A17">
<option>最近更新</option>
<option>建立時間</option>
<option>寺廟名稱</option>
</select>
</div>
<div style="flex: 1 1 0"></div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: none; border-radius: 8px; background: #B3261E; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
新增影片</button>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px">
<sc-for list="{{videos}}" as="v" hint-placeholder-count="5">
<article style="background: #FFFFFF; border: 1px solid #E3DDD3; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
<div role="img" aria-label="{{v.thumbAlt}}" style="position: relative; aspect-ratio: 16 / 9; background: #F2EEE6; display: flex; align-items: center; justify-content: center; color: #9C9187">
<svg aria-hidden="true" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="M7 5v14"></path><path d="M17 5v14"></path><path d="M3 9h4"></path><path d="M3 15h4"></path><path d="M17 9h4"></path><path d="M17 15h4"></path></svg>
<sc-if value="{{v.hasDuration}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; right: 10px; bottom: 10px; background: #1F1A17; color: #FFFFFF; font-size: 12px; border-radius: 6px; padding: 2px 8px; font-variant-numeric: tabular-nums">{{v.duration}}</span>
</sc-if>
</div>
<div style="padding: 16px 20px 20px; display: flex; flex-direction: column; gap: 8px; flex: 1 1 auto">
<div style="display: flex; gap: 6px; flex-wrap: wrap">
<span style="{{v.statusStyle}}">{{v.status}}</span>
<sc-if value="{{v.isFirst}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; border-radius: 999px; padding: 2px 10px; background: #F2EEE6; color: #3D3631">問卷預設來源</span>
</sc-if>
</div>
<h2 style="margin: 0; font-size: 18px; line-height: 1.4">{{v.title}}</h2>
<p style="margin: 0; font-size: 14px; color: #3D3631">{{v.temple}}</p>
<p style="margin: 0; display: flex; gap: 6px; align-items: center; font-size: 13px; color: #5E5650">
<svg role="img" aria-label="模型已鎖定" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>
{{v.models}}</p>
<p style="margin: 0; font-size: 13px; color: #5E5650">{{v.updated}}</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 8px">
<a href="Videos.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #1F1A17; border-radius: 8px; background: #FFFFFF; color: #1F1A17; font-size: 14px; font-weight: 500; text-decoration: none">{{v.openLabel}}</a>
<button type="button" style="display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 14px; border: 1px solid #CFC7BA; border-radius: 8px; background: #FFFFFF; color: #1F1A17; font-size: 14px; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"></rect><path d="M5 15V5a2 2 0 012-2h8"></path></svg>
複製這支影片</button>
<sc-if value="{{v.canDownload}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="{{v.downloadLabel}}" style="width: 44px; height: 44px; border: 1px solid #CFC7BA; border-radius: 8px; background: #FFFFFF; color: #1F1A17; cursor: pointer; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11"></path><path d="M7 10l5 5 5-5"></path><path d="M5 20h14"></path></svg>
</button>
</sc-if>
</div>
</div>
</article>
</sc-for>
</div>

<p style="margin: 0; font-size: 13px; color: #5E5650">「複製這支影片」會帶入寺廟、問卷答案與分鏡方案（不含已生成的圖片與影片），再到建立影片頁選擇模型。</p>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    var self = this;
    var tag = 'font-size: 12px; border-radius: 999px; padding: 2px 10px; ';
    var ok = tag + 'background: #E6F0EA; color: #245A40';
    var warn = tag + 'background: #FBF0D6; color: #6E5418';
    var info = tag + 'background: #E8EEF6; color: #1F4E79';
    var neutral = tag + 'background: #F2EEE6; color: #3D3631';
    var all = [
      { title: '清水巖：午後的廟埕', temple: '清水巖・淡水區', models: 'Nano Banana Pro・Gemini Omni 1.1 Flash', status: '影片生成中', statusStyle: info, group: 'wip', duration: '', updated: '更新於 2026-11-04 21:10', openLabel: '繼續製作' },
      { title: '鄞山寺：石獅與燕尾脊', temple: '鄞山寺・淡水區', models: 'Nano Banana Pro・Gemini Omni 1.1 Flash', status: '寺廟定裝版待確認', statusStyle: warn, group: 'wip', duration: '', updated: '沿用系列中已確認的定裝版・更新於 2026-11-04 10:32', openLabel: '繼續製作' },
      { title: '淡水龍山寺：市場裡的廟', temple: '淡水龍山寺・淡水區', models: 'Nano Banana Pro・Seedance 2.0', status: '精緻圖・2 格需重新確認', statusStyle: warn, group: 'wip', duration: '', updated: '更新於 2026-11-02 16:48', openLabel: '繼續製作' },
      { title: '淡水福佑宮：港口的燈', temple: '淡水福佑宮・淡水區', models: 'Nano Banana Pro・Seedance 2.0', status: '完成', statusStyle: ok, group: 'done', duration: '0:30', updated: '完成於 2026-10-26', openLabel: '開啟成品' },
      { title: '鄞山寺：渡海的香火', temple: '鄞山寺・淡水區', models: 'Nano Banana Pro・Gemini Omni 1.1 Flash', status: '完成', statusStyle: ok, group: 'done', duration: '0:28', updated: '完成於 2026-10-18', openLabel: '開啟成品', isFirst: true }
    ];
    var f = this.state.filter;
    var list = all.filter(function (v) { return f === 'all' || v.group === f; });
    var filters = [{ id: 'all', label: '全部 5' }, { id: 'wip', label: '製作中 3' }, { id: 'done', label: '完成 2' }];
    return {
      filters: filters.map(function (x) {
        var on = f === x.id;
        var base = 'height: 44px; padding: 0 16px; border-radius: 8px; font-size: 14px; cursor: pointer; color: #1F1A17; ';
        return {
          label: x.label, pressed: on ? 'true' : 'false',
          style: on ? base + 'border: 2px solid #1F1A17; background: #F2EEE6; font-weight: 700' : base + 'border: 1px solid #CFC7BA; background: #FFFFFF',
          pick: function () { self.setState({ filter: x.id }); }
        };
      }),
      videos: list.map(function (v) {
        return Object.assign({ isFirst: false }, v, {
          hasDuration: !!v.duration,
          canDownload: v.group === 'done',
          thumbAlt: v.title + ' 縮圖',
          downloadLabel: '下載〈' + v.title + '〉'
        });
      }),
      neutral: neutral
    };
  }
}
</script>
</body>
</html>
