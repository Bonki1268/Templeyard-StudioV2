<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<title>角色庫</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&amp;family=Noto+Serif+TC:wght@700&amp;display=swap">
<style>
body{margin:0;background:#F7F5F0}
a{color:#1F4E79}a:hover{color:#163A5C}
button,input{font-family:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #1F1A17;outline-offset:2px}
</style>
</helmet>
<div style="min-height: 100vh; background: #F7F5F0; color: #1F1A17; font-family: 'Noto Sans TC', system-ui, sans-serif; font-size: 15px; line-height: 1.6; padding-bottom: 48px">

<header style="background: #FFFFFF; border-bottom: 1px solid #E3DDD3">
<div style="max-width: 1280px; margin: 0 auto; padding: 0 32px; min-height: 64px; display: flex; align-items: center; gap: 20px; flex-wrap: wrap">
<a href="Main.dc.html" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: #1F1A17">
<span style="width: 32px; height: 32px; border-radius: 8px; background: #B3261E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 17px">廟</span>
<span style="font-family: 'Noto Serif TC', serif; font-weight: 700; font-size: 18px">廟埕影室</span>
</a>
<nav aria-label="目前位置" style="font-size: 14px; color: #5E5650">我的系列 › 淡水廟宇故事</nav>
</div>
</header>

<section style="max-width: 1280px; margin: 0 auto; padding: 32px 32px 0">
<p style="margin: 0; font-size: 13px; color: #5E5650">系列</p>
<h1 style="margin: 2px 0 4px; font-family: 'Noto Serif TC', serif; font-size: 36px; line-height: 1.3">淡水廟宇故事</h1>
<p style="margin: 0; font-size: 14px; color: #5E5650">5 支影片・3 位角色・建立於 2026-10-12</p>
<nav aria-label="系列頁面" style="display: flex; gap: 28px; margin-top: 24px; border-bottom: 1px solid #E3DDD3; flex-wrap: wrap">
<a href="Main.dc.html" style="padding: 12px 2px; text-decoration: none; color: #5E5650; border-bottom: 2px solid transparent; margin-bottom: -1px">系列設定</a>
<a href="Characters.dc.html" aria-current="page" style="padding: 12px 2px; text-decoration: none; color: #1F1A17; font-weight: 700; border-bottom: 2px solid #1F1A17; margin-bottom: -1px; display: flex; gap: 8px; align-items: center">角色庫 <span style="font-size: 12px; background: #F2EEE6; border-radius: 999px; padding: 0 8px; color: #3D3631; font-weight: 400">3</span></a>
<a href="Videos.dc.html" style="padding: 12px 2px; text-decoration: none; color: #5E5650; border-bottom: 2px solid transparent; margin-bottom: -1px; display: flex; gap: 8px; align-items: center">過去的影片 <span style="font-size: 12px; background: #F2EEE6; border-radius: 999px; padding: 0 8px; color: #3D3631">5</span></a>
</nav>
</section>

<main style="max-width: 1280px; margin: 0 auto; padding: 24px 32px 0; display: flex; flex-direction: column; gap: 20px">

<div style="display: flex; align-items: center; gap: 12px; flex-wrap: wrap">
<div style="position: relative; flex: 1 1 260px; max-width: 360px">
<label for="char-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">搜尋角色</label>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5E5650" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="position: absolute; left: 12px; top: 13px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
<input id="char-search" type="search" placeholder="搜尋角色名稱或描述" style="width: 100%; box-sizing: border-box; height: 44px; border: 1px solid #CFC7BA; border-radius: 8px; padding: 0 14px 0 38px; font-size: 15px; background: #FFFFFF">
</div>
<div role="group" aria-label="篩選角色" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
<button type="button" aria-pressed="{{f.pressed}}" onClick="{{f.pick}}" style="{{f.style}}">{{f.label}}</button>
</sc-for>
</div>
<div style="flex: 1 1 0"></div>
<button type="button" style="display: inline-flex; align-items: center; gap: 8px; height: 48px; padding: 0 22px; border: none; border-radius: 8px; background: #B3261E; color: #FFFFFF; font-size: 16px; font-weight: 700; cursor: pointer">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14"></path><path d="M5 12h14"></path></svg>
新增角色</button>
</div>

<p style="margin: 0; font-size: 14px; color: #3D3631; background: #FFFFFF; border: 1px solid #E3DDD3; border-radius: 12px; padding: 12px 16px">系列角色可以在這個系列的任何影片直接沿用。角色的連續性鎖會逐字帶進每一格的生成指令；修改角色會另存新版本，正在製作的影片改用新版本時，相關畫面會標示「需重新確認」。</p>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px">
<sc-for list="{{chars}}" as="c" hint-placeholder-count="3">
<article style="background: #FFFFFF; border: 1px solid #E3DDD3; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 3fr 2fr; gap: 2px; background: #E3DDD3; aspect-ratio: 16 / 9">
<div role="img" aria-label="{{c.sheetAlt}}" style="background: #F2EEE6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #5E5650">
<div style="display: flex; gap: 10px" aria-hidden="true">
<svg width="26" height="54" viewBox="0 0 26 54" fill="none" stroke="#9C9187" stroke-width="1.6"><circle cx="13" cy="8" r="6"></circle><path d="M4 50V24a9 9 0 0118 0v26"></path></svg>
<svg width="20" height="54" viewBox="0 0 20 54" fill="none" stroke="#9C9187" stroke-width="1.6"><circle cx="10" cy="8" r="5.5"></circle><path d="M4 50V24a6 6 0 0112 0v26"></path></svg>
<svg width="26" height="54" viewBox="0 0 26 54" fill="#E3DDD3" stroke="#9C9187" stroke-width="1.6"><circle cx="13" cy="8" r="6"></circle><path d="M4 50V24a9 9 0 0118 0v26"></path></svg>
</div>
<span style="font-size: 12px">三視圖 {{c.version}}</span>
</div>
<div role="img" aria-label="{{c.lookAlt}}" style="background: #F2EEE6; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #5E5650">
<svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#9C9187" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="12" cy="10" r="3"></circle><path d="M6 20a6 6 0 0112 0"></path></svg>
<span style="font-size: 12px">定裝圖</span>
</div>
</div>
<div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto">
<div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap">
<h2 style="margin: 0; font-size: 19px">{{c.name}}</h2>
<span style="{{c.kindStyle}}">{{c.kind}}</span>
<span style="{{c.statusStyle}}">{{c.status}}</span>
</div>
<p style="margin: 0; font-size: 14px; color: #3D3631">{{c.desc}}</p>
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 12px; color: #5E5650">連續性鎖</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<sc-for list="{{c.locks}}" as="lock" hint-placeholder-count="2">
<code style="font-family: ui-monospace, 'SFMono-Regular', Menlo, monospace; font-size: 12px; background: #F2EEE6; color: #1F1A17; border-radius: 6px; padding: 3px 8px">{{lock}}</code>
</sc-for>
</div>
</div>
<p style="margin: 4px 0 0; font-size: 13px; color: #5E5650">{{c.meta}}</p>
<div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: auto; padding-top: 6px">
<a href="CharacterDetail.dc.html" style="display: inline-flex; align-items: center; height: 44px; padding: 0 16px; border: 1px solid #CFC7BA; border-radius: 8px; background: #FFFFFF; color: #1F1A17; font-size: 14px; text-decoration: none">查看與修改</a>
<sc-if value="{{c.promote}}" hint-placeholder-val="{{false}}">
<button type="button" style="height: 44px; padding: 0 16px; border: 1px solid #CFC7BA; border-radius: 8px; background: #FFFFFF; color: #1F1A17; font-size: 14px; cursor: pointer">設為系列角色</button>
</sc-if>
</div>
</div>
</article>
</sc-for>
</div>

<sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; text-align: center; padding: 40px 16px; color: #5E5650; background: #FFFFFF; border: 1px dashed #CFC7BA; border-radius: 12px">這個篩選條件下沒有角色。</p>
</sc-if>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1240}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all' };
  }
  renderVals() {
    var self = this;
    var tag = 'font-size: 12px; border-radius: 999px; padding: 2px 10px; ';
    var all = [
      {
        name: '導覽員阿亮', type: 'series', kind: '系列角色', kindStyle: tag + 'background: #F2EEE6; color: #3D3631',
        status: '已確認', statusStyle: tag + 'background: #E6F0EA; color: #245A40', version: 'v2',
        desc: '二十多歲青年，短黑髮、圓臉；白色亞麻襯衫捲到手肘，卡其褲，斜背棕色帆布相機背帶。',
        locks: ['white linen shirt with rolled sleeves', 'tan canvas camera strap'],
        meta: '出現在 4 支影片・目前 v2・更新於 2026-10-20', promote: false
      },
      {
        name: '廟公阿伯', type: 'series', kind: '系列角色', kindStyle: tag + 'background: #F2EEE6; color: #3D3631',
        status: '已確認', statusStyle: tag + 'background: #E6F0EA; color: #245A40', version: 'v1',
        desc: '六十多歲，花白平頭、清瘦；褪色深藍棉布長衫，灰色毛呢鴨舌帽，手腕戴木珠。',
        locks: ['faded navy cotton changshan', 'grey wool flat cap'],
        meta: '出現在 3 支影片・目前 v1・更新於 2026-10-14', promote: false
      },
      {
        name: '小晴', type: 'video', kind: '影片專屬', kindStyle: tag + 'background: #E8EEF6; color: #1F4E79',
        status: '定裝圖待確認', statusStyle: tag + 'background: #FBF0D6; color: #6E5418', version: 'v1',
        desc: '二十出頭的女生，及肩直髮；朱紅刺繡絲質背心配白色上衣，深色長裙。',
        locks: ['crimson silk embroidered vest'],
        meta: '只用在〈淡水龍山寺：市場裡的廟〉・更新於 2026-11-02', promote: true
      }
    ];
    var f = this.state.filter;
    var list = all.filter(function (c) { return f === 'all' || c.type === f; });
    var filters = [{ id: 'all', label: '全部 3' }, { id: 'series', label: '系列角色 2' }, { id: 'video', label: '影片專屬 1' }];
    return {
      filters: filters.map(function (x) {
        var on = f === x.id;
        var base = 'height: 44px; padding: 0 16px; border-radius: 8px; font-size: 14px; cursor: pointer; color: #1F1A17; ';
        return {
          label: x.label, pressed: on ? 'true' : 'false',
          style: on ? base + 'border: 2px solid #1F1A17; background: #F2EEE6; font-weight: 700' : base + 'border: 1px solid #CFC7BA; background: #FFFFFF',
          pick: function () { self.setState({ filter: x.id }); }
        };
      }),
      chars: list.map(function (c) {
        return Object.assign({}, c, { sheetAlt: c.name + ' 三視圖 ' + c.version, lookAlt: c.name + ' 定裝圖' });
      }),
      empty: list.length === 0
    };
  }
}
</script>
</body>
</html>
